[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answerguard-sdk"
version = "0.1.0"
description = "AnswerGuard Python SDK — capture Q&A pairs at runtime"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["answerguard"]
