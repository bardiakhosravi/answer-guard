services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgresql://answerguard:answerguard@db:5432/answerguard
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - BIGQUERY_PAGE_SIZE=${BIGQUERY_PAGE_SIZE:-5000}
    volumes:
      # Mount the host home directory read-only so absolute paths to GCP
      # credential files (e.g. /Users/<you>/key.json) resolve identically
      # inside the container. Safe for local dev because (a) it's read-only
      # and (b) the backend only reads files whose paths the user explicitly
      # enters in the UI.
      - ${HOME}:${HOME}:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=answerguard
      - POSTGRES_PASSWORD=answerguard
      - POSTGRES_DB=answerguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
